<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="signup-container">
        <h2>Signup</h2>
        <form id="signup-form">
            <!-- Name Field -->
            <label for="name">Name: <span class="required">*</span></label>
            <input type="text" id="name" name="name" required>
            
            <!-- Email Field -->
            <label for="email">Email: <span class="required">*</span></label>
            <input type="email" id="email" name="email" required>

            <!-- Contact Number Field -->
            <label for="contact-number">Contact Number: <span class="required">*</span></label>
            <input type="text" id="contact-number" name="contact-number" required>

            <!-- WhatsApp Number Field -->
            <label for="whatsapp-number">WhatsApp Number: <span class="required">*</span></label>
            <input type="text" id="whatsapp-number" name="whatsapp-number" required>

            <!-- Checkbox for WhatsApp Same as Contact Number -->
            <label for="same-as-contact">
                <input type="checkbox" id="same-as-contact" name="same-as-contact"> Same as contact-number
            </label>

            <!-- Gender Dropdown -->
            <label for="gender">Gender: <span class="required">*</span></label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="not-sure">Not Sure</option>
            </select>

            <!-- Address Field -->
            <label for="address">Address:</label>
            <textarea id="address" name="address"></textarea>

            <!-- Password Field -->
            <label for="password">Password: <span class="required">*</span></label>
            <input type="password" id="password" name="password" required>

            <!-- Confirm Password Field -->
            <label for="confirm-password">Confirm Password: <span class="required">*</span></label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <!-- Submit Button -->
            <button type="submit">Signup</button>
        </form>

        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
